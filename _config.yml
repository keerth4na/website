plugins:
  - jekyll-remote-theme

remote_theme: mmistakes/minimal-mistakes@4.24.0
minimal_mistakes_skin: "air" # Ultra-clean, professional white/gray palette

title: "Keerthana Kompella"
name: "Keerthana Kompella"
bio: "HCI & CSCW Researcher | Svoboda Diaries Project Manager"
location: "Seattle, WA"
email: "keertk@uw.edu"
uri: "https://keerth4na.github.io/website"

# Structural Collections
collections:
  publications:
    output: true
    permalink: /publications/:path/
  projects:
    output: true
    permalink: /projects/:path/

# Navigation bar configuration
defaults:
  - scope:
      path: ""
      type: "publications"
    values:
      layout: "single"
      sidebar:
        nav: "main"
  - scope:
      path: ""
    values:
      layout: "single"
      author_profile: true # Forces the classic professor-style sidebar
